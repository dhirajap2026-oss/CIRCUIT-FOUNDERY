<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CircuitFoundry</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <div class="auth-wrapper">
            <div class="auth-header">
                <h1 class="auth-logo">CircuitFoundry</h1>
                <p class="auth-subtitle">Welcome back! Please login to your account</p>
            </div>
            
            <form class="auth-form" id="login-form">
                <div class="form-group">
                    <label for="login-username" class="form-label">Username or Email</label>
                    <input type="text" id="login-username" name="login-username" class="form-input" required>
                    <span class="error-message" id="login-username-error"></span>
                </div>
                
                <div class="form-group">
                    <label for="login-password" class="form-label">Password</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="login-password" name="login-password" class="form-input" required>
                        <button type="button" class="password-toggle" id="login-password-toggle">
                            <span class="toggle-icon">👁️</span>
                        </button>
                    </div>
                    <span class="error-message" id="login-password-error"></span>
                </div>
                
                <button type="submit" class="btn btn-primary btn-large" id="login-btn">Login</button>
            </form>
            
            <div class="auth-footer">
                <p class="auth-footer-text">Don't have an account? <a href="signup.html" class="auth-link">Sign up here</a></p>
            </div>
        </div>
    </div>
    
    <script src="js/auth.js"></script>
</body>
</html>
